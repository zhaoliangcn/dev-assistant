{% extends "base.html" %}

{% block title %}Dev-Assistant 对话{% endblock %}

{% block content %}
<div class="grid chat-layout" x-data="chatApp()">
    <!-- 左侧：会话列表 -->
    <div class="session-sidebar">
        <div class="session-header">
            <strong>💬 会话历史</strong>
            <button type="button" class="copy-btn" @click="loadSessions()">🔄</button>
        </div>
        <button type="button" class="session-new" @click="newChat()">＋ 新对话</button>
        <div class="session-list">
            <template x-for="s in sessions" :key="s.id">
                <div class="session-item"
                     @click="selectSession(s.id)"
                     :class="{ 'session-active': activeSessionId === s.id }">
                    <div class="session-item-main">
                        <!-- 重命名编辑态：内联输入框 -->
                        <div x-show="renamingId === s.id" @click.stop>
                            <input type="text" class="session-rename-input"
                                   x-model="renameTitle"
                                   :key="s.id"
                                   @keydown.enter="submitRename(s.id)"
                                   @keydown.escape="cancelRename()"
                                   @click.stop>
                        </div>
                        <!-- 常规显示态 -->
                        <template x-if="renamingId !== s.id">
                            <div class="session-item-title" x-text="s.title || ('会话 ' + s.id)"></div>
                        </template>
                        <div class="session-item-meta">
                            <span x-text="formatSessionTime(s.created_at)"></span>
                            <span>·</span>
                            <span x-text="s.message_count + ' 条'"></span>
                        </div>
                    </div>
                    <div class="session-item-actions">
                        <button type="button" class="copy-btn small"
                                @click.stop="startRename(s)">✏️</button>
                        <button type="button" class="copy-btn small session-delete"
                                @click.stop="deleteSession(s.id)">🗑</button>
                    </div>
                </div>
            </template>
            <div class="session-empty" x-show="!loadingSessions && sessions.length === 0">
                暂无历史会话
            </div>
            <div class="session-empty" x-show="loadingSessions">加载中...</div>
        </div>
    </div>

    <!-- 右侧：对话面板 -->
    <div class="chat-panel">
        <div id="message-list" class="message-list" x-ref="list">
            <!-- 欢迎消息 -->
            <div class="message system" x-show="messages.length === 0">
                <div class="message-body">
                    <p>👋 你好！我是 Dev-Assistant，你的 AI 编程助手。</p>
                    <p>发送消息开始对话，我会使用各种工具帮助你完成任务。</p>
                </div>
            </div>

            <!-- 可替换状态条（思考/状态，不进入消息列表） -->
            <div class="thinking" x-show="pendingStatus !== null">
                <span class="spinner" x-show="pendingStatus && pendingStatus.role === 'thinking'"></span>
                <span x-text="pendingStatus ? pendingStatus.content : ''"></span>
            </div>

            <!-- 消息列表 -->
            <template x-for="msg in messages">
                <div>
                    <!-- 用户消息 -->
                    <div x-show="msg.role === 'user'" class="message user">
                        <div class="message-avatar">👤</div>
                        <div class="message-body">
                            <div class="message-header">
                                <span class="message-role">你</span>
                                <span class="message-time" x-text="msg.time || ''"></span>
                            </div>
                            <div class="message-content" x-text="msg.content"></div>
                        </div>
                    </div>

                    <!-- 助手消息（流式时带 streaming 边框） -->
                    <div x-show="msg.role === 'assistant'"
                         class="message assistant"
                         :class="{ 'streaming': msg.streaming }">
                        <div class="message-avatar">🤖</div>
                        <div class="message-body">
                            <div class="message-header">
                                <span class="message-role">助手</span>
                                <span class="message-time" x-text="msg.time || ''"></span>
                                <button type="button" class="copy-btn small"
                                        @click="copyMessage(msg.content)"
                                        x-text="copiedMessageId ? '✅ 已复制' : '📋 复制'"></button>
                            </div>
                            <div class="message-content markdown-body" x-html="formatContent(msg.content)"></div>
                        </div>
                    </div>

                    <!-- 工具结果（折叠展示） -->
                    <div x-show="msg.role === 'tool-result'" class="message tool-result">
                        <div class="message-avatar">🔧</div>
                        <div class="message-body">
                            <details class="collapsible" :open="msg.content.length < 200">
                                <summary>工具结果</summary>
                                <div class="collapsible-content message-content" x-text="msg.content"></div>
                            </details>
                        </div>
                    </div>

                    <!-- 工具调用 -->
                    <div x-show="msg.role === 'tool-call'" class="message tool-result">
                        <div class="message-avatar">🔧</div>
                        <div class="message-body">
                            <div class="message-content" x-text="msg.content"></div>
                        </div>
                    </div>

                    <!-- 系统/状态 -->
                    <div x-show="msg.role === 'system'" class="message system" style="font-size:0.85em;opacity:0.7;">
                        <div class="message-body">
                            <div class="message-content" x-text="msg.content"></div>
                        </div>
                    </div>

                    <!-- 错误 -->
                    <div x-show="msg.role === 'error'" class="message" style="align-self:center;color:var(--pico-del-color);">
                        <div class="message-body">
                            <div class="message-content" x-text="msg.content"></div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <form class="input-form"
                  @submit.prevent="sendMessage()">
                <div class="grid">
                    <textarea x-model="input"
                              placeholder="输入消息... (Enter 发送，Shift+Enter 换行)"
                              rows="2"
                              autofocus
                              required
                              @keydown="onInputKeydown($event)"></textarea>
                    <!-- W10: 生成中显示停止按钮，否则显示发送按钮 -->
                    <button type="submit" class="primary" :disabled="!input.trim() || busy"
                            x-show="!busy">
                        发送
                    </button>
                    <button type="button" class="secondary stop-btn"
                            x-show="busy"
                            @click="stopGeneration()">
                        ⏹ 停止
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
