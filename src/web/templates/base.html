<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dev-Assistant{% endblock %}</title>
    <!-- PWA 元标签（P4） -->
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Dev-Assistant - AI 编程助手">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dev-Assistant">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- highlight.js 主题样式：由 theme.js 按当前主题切换（暗色 github-dark / 亮色 github） -->
    <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- 首屏主题防闪烁：在 Alpine 加载前按 localStorage 提前应用主题，
         避免暗色用户先看到一帧白屏（FOUC） -->
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('dev-assistant-theme') || 'auto';
                var dark = theme === 'dark' ||
                    (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { /* localStorage 不可用时静默忽略 */ }
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <!-- 模块化脚本：Store / 主题 → 工具函数 → 国际化 → 性能监控 → 侧栏组件 → 聊天组件 → 文件浏览器。
         注意：Alpine 必须放在所有模块脚本之后，因为模块脚本需在 alpine:init 前注册 store/全局组件，
         而 Alpine CDN 会在自身脚本执行后立即启动（queueMicrotask），若提前加载会错过这些注册。 -->
    <script type="module" src="/static/js/theme.js"></script>
    <script type="module" src="/static/js/utils.js"></script>
    <script type="module" src="/static/js/i18n.js"></script>
    <script type="module" src="/static/js/sidebar.js"></script>
    <script type="module" src="/static/js/chat.js"></script>
    <script type="module" src="/static/js/file-explorer.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- P3: Service Worker 注册（离线缓存） -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/js/sw.js')
                    .then((reg) => {
                        console.log('[SW] 注册成功:', reg.scope);
                        // E1: 检测到新 SW 进入 waiting 状态时，通知其立即接管；
                        // 接管完成后刷新页面以加载新静态资源。
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            if (!newWorker) return;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });
                    })
                    .catch((err) => console.log('[SW] 注册失败:', err));
                // 控制器变更（新 SW 接管）后刷新一次
                let reloading = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (reloading) return;
                    reloading = true;
                    window.location.reload();
                });
            });
        }
    </script>
    <!-- P4: PWA 安装提示 -->
    <script>
        let deferredPrompt = null;
        let installPromptShown = false;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // 延迟显示安装提示，避免打扰用户
            setTimeout(() => {
                if (deferredPrompt && !installPromptShown) {
                    showInstallPrompt();
                }
            }, 30000); // 30 秒后显示
        });
        
        function showInstallPrompt() {
            if (installPromptShown || !deferredPrompt) return;
            installPromptShown = true;
            
            // 创建安装提示横幅
            const banner = document.createElement('div');
            banner.className = 'pwa-install-banner';
            banner.innerHTML = `
                <div class="pwa-install-content">
                    <span class="pwa-install-icon">📱</span>
                    <div class="pwa-install-text">
                        <strong>安装 Dev-Assistant</strong>
                        <p>添加到主屏幕，获得更好的体验</p>
                    </div>
                    <div class="pwa-install-actions">
                        <button class="pwa-install-btn" id="pwa-install-accept">安装</button>
                        <button class="pwa-install-dismiss" id="pwa-install-dismiss">稍后</button>
                    </div>
                </div>
            `;
            document.body.appendChild(banner);
            
            // 绑定事件
            document.getElementById('pwa-install-accept').addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log('[PWA] 安装结果:', outcome);
                    deferredPrompt = null;
                }
                banner.remove();
            });
            
            document.getElementById('pwa-install-dismiss').addEventListener('click', () => {
                banner.remove();
            });
        }
        
        // 应用安装成功
        window.addEventListener('appinstalled', () => {
            console.log('[PWA] 应用已安装');
            deferredPrompt = null;
            const banner = document.querySelector('.pwa-install-banner');
            if (banner) banner.remove();
        });
    </script>
</head>
<body>
    <header class="container-fluid">
        <nav x-data="{}">
            <ul>
                            <li><strong><a href="/" class="contrast">🤖 Dev-Assistant</a></strong></li>
                            <li x-show="window.innerWidth <= 480">
                                <button class="outline secondary mobile-menu-btn"
                                        @click="$store.sidebar.toggle()"
                                        :aria-label="$store.i18n.menu">
                                    ☰
                                </button>
                            </li>
                            <!-- 语言切换（P4） -->
                            <li>
                                <select class="model-select"
                                        x-model="$store.i18n.currentLang"
                                        @change="$store.i18n.setLanguage($store.i18n.currentLang)"
                                        :aria-label="$store.i18n.search">
                                    <template x-for="lang in $store.i18n.availableLanguages" :key="lang.code">
                                        <option :value="lang.code" x-text="lang.name"></option>
                                    </template>
                                </select>
                            </li>
                        </ul>
                        <ul>
                            <li>
                                <span class="status-indicator"
                                      :class="$store.connection.connected ? 'online' : 'offline'"
                                      :title="$store.connection.connected ? $store.i18n.online : $store.i18n.offline">
                                    <span class="status-dot" aria-hidden="true"></span>
                                    <span x-text="$store.connection.connected ? $store.i18n.online : $store.i18n.offline"></span>
                                </span>
                            </li>
                            <li>
                                <select class="model-select"
                                        x-model="$store.models.active"
                                        x-show="$store.models.loaded && $store.models.list.length > 1"
                                        @change="$store.models.switchModel($store.models.active)"
                                        :title="$store.i18n.model + ': ' + $store.models.active"
                                        :aria-label="$store.i18n.model">
                                    <template x-for="m in $store.models.list" :key="m.name">
                                        <option :value="m.name" x-text="m.name"></option>
                                    </template>
                                </select>
                                <span class="model-label" x-show="$store.models.loaded && $store.models.list.length <= 1"
                                      x-text="$store.models.active ? ($store.i18n.model + ': ' + $store.models.active) : ''"></span>
                            </li>
                            <li>
                                <button class="outline secondary header-btn"
                                        @click="$store.models.openPanel()"
                                        :title="$store.i18n.model_settings" :aria-label="$store.i18n.model_settings">
                                    ⚙️
                                </button>
                            </li>
                            <li>
                                <span class="token-usage" x-show="$store.tokenUsage.total > 0"
                                      :title="$store.tokenUsage.detail()" style="font-size:0.8em;opacity:0.7;">
                                    <span x-text="$store.tokenUsage.label()"></span>
                                </span>
                            </li>
                            <li>
                                <button class="outline secondary header-btn"
                                        @click="$store.theme.toggle()" :title="$store.theme.modeLabel()" :aria-label="$store.i18n.theme">
                                    <span x-text="$store.theme.label()"></span>
                                </button>
                            </li>
                            <!-- P5: 主题定制按钮 -->
                            <li>
                                <button class="outline secondary header-btn"
                                        @click="$store.customization.visible = !$store.customization.visible"
                                        title="$store.i18n.theme_custom" :aria-label="$store.i18n.theme_custom">
                                    🎨
                                </button>
                            </li>
                            <!-- 性能监控按钮（P5） -->
                            <li>
                                <button class="outline secondary header-btn"
                                        @click="$store.performance.toggle()"
                                        :title="$store.i18n.performance + ': FPS ' + $store.performance.fps"
                                        :aria-label="$store.i18n.performance">
                                    📊
                                </button>
                            </li>
                            <li><a href="/" role="button" class="outline secondary header-btn" x-text="$store.i18n.chat"></a></li>
                            <li><a href="/files" role="button" class="outline secondary header-btn" x-text="$store.i18n.files"></a></li>
                        </ul>
                    </nav>
                </header>
    <main class="container-fluid">
        {% block content %}{% endblock %}
    </main>
    <!-- 性能监控面板（P5） -->
    <div x-data>
    <div id="performance-panel" class="performance-panel" x-show="$store.performance.visible" x-cloak>
        <div class="performance-header">
            <strong x-text="'📊 ' + $store.i18n.performance"></strong>
            <button type="button" class="copy-btn" @click="$store.performance.toggle()">✕</button>
        </div>
        <div class="performance-metrics">
            <div class="metric">
                <span class="metric-label">FPS</span>
                <span class="metric-value" id="perf-fps">0</span>
            </div>
            <div class="metric">
                <span class="metric-label">内存</span>
                <span class="metric-value" id="perf-memory">N/A</span>
            </div>
            <div class="metric">
                <span class="metric-label">事件监听器</span>
                <span class="metric-value" id="perf-listeners">0</span>
            </div>
        </div>
    </div>
    <!-- 主题定制面板（P5） -->
    <div id="customization-panel" class="customization-panel" x-show="$store.customization.visible" x-cloak>
        <div class="customization-header">
            <strong x-text="'🎨 ' + $store.i18n.theme_custom"></strong>
            <button type="button" class="copy-btn" @click="$store.customization.visible = false">✕</button>
        </div>
        <div class="customization-body">
            <div class="customize-item">
                <label>字体大小</label>
                <input type="range" min="12" max="20" step="1" 
                       x-model="$store.customization.fontSize"
                       @input="$store.customization.updateFontSize($store.customization.fontSize)">
                <span x-text="$store.customization.fontSize + 'px'"></span>
            </div>
            <div class="customize-item">
                <label>圆角大小</label>
                <input type="range" min="0" max="16" step="1" 
                       x-model="$store.customization.borderRadius"
                       @input="$store.customization.updateRadius($store.customization.borderRadius)">
                <span x-text="$store.customization.borderRadius + 'px'"></span>
            </div>
            <div class="customize-item">
                <label>主题色</label>
                <input type="color" x-model="$store.customization.primaryColor"
                       @input="$store.customization.updatePrimaryColor($store.customization.primaryColor)">
            </div>
        </div>
    </div>
    <!-- 模型设置面板（P6）：配置模型 URL / 提供商 / 密钥等信息，增删改后持久化 -->
    <div id="model-settings-panel" class="model-settings-panel" x-show="$store.models.panelOpen" x-cloak>
        <div class="model-settings-header">
            <strong x-text="'⚙️ ' + $store.i18n.model_settings"></strong>
            <button type="button" class="copy-btn" @click="$store.models.closePanel()">✕</button>
        </div>
        <div class="model-settings-body">
            <p class="model-settings-path" x-show="$store.models.configPath"
               x-text="'📄 ' + $store.i18n.config_file + ': ' + $store.models.configPath"></p>
            <p class="model-settings-hint" x-text="$store.i18n.model_settings_hint"></p>

            <!-- 已配置模型列表 -->
            <div class="model-list">
                <template x-for="m in $store.models.list" :key="m.name">
                    <div class="model-item" :class="m.active ? 'model-item-active' : ''">
                        <div class="model-item-info">
                            <div class="model-item-title">
                                <strong x-text="m.name"></strong>
                                <span class="model-item-badge" x-show="m.active" x-text="$store.i18n.active"></span>
                            </div>
                            <small x-text="m.provider + ' · ' + m.model"></small>
                            <small class="model-item-url" x-text="m.api_url"></small>
                            <small x-text="m.has_api_key ? ('🔑 ' + $store.i18n.api_key_set) : $store.i18n.api_key_missing"></small>
                        </div>
                        <div class="model-item-actions">
                            <button class="outline secondary" @click="$store.models.editModel(m)" x-text="$store.i18n.edit"></button>
                            <button class="outline secondary" @click="$store.models.deleteModel(m.name)" x-text="$store.i18n.delete"></button>
                        </div>
                    </div>
                </template>
                <p class="model-list-empty" x-show="$store.models.list.length === 0" x-text="$store.i18n.no_models"></p>
            </div>

            <!-- 新增/编辑表单 -->
            <div class="model-editor" x-show="$store.models.editorOpen" x-cloak>
                <h5 x-text="$store.models.editingName ? $store.i18n.edit_model : $store.i18n.add_model"></h5>
                <div class="model-form-grid">
                    <label>
                        <span x-text="$store.i18n.model_name"></span>
                        <input type="text" x-model="$store.models.form.name"
                               :disabled="$store.models.editingName !== null"
                               :placeholder="$store.i18n.model_name_placeholder">
                    </label>
                    <label>
                        <span x-text="$store.i18n.provider"></span>
                        <select x-model="$store.models.form.provider">
                            <template x-for="p in $store.models.providers" :key="p">
                                <option :value="p" x-text="p"></option>
                            </template>
                        </select>
                    </label>
                    <label class="model-form-full">
                        <span x-text="$store.i18n.api_url"></span>
                        <input type="text" x-model="$store.models.form.api_url" placeholder="https://api.openai.com/v1">
                    </label>
                    <label class="model-form-full">
                        <span x-text="$store.i18n.api_key"></span>
                        <input type="password" x-model="$store.models.form.api_key"
                               autocomplete="new-password"
                               :placeholder="$store.models.form.hasKey ? $store.i18n.api_key_keep : ''">
                        <label class="model-checkbox" x-show="$store.models.form.hasKey">
                            <input type="checkbox" x-model="$store.models.form.clear_api_key">
                            <span x-text="$store.i18n.clear_api_key"></span>
                        </label>
                    </label>
                    <label>
                        <span x-text="$store.i18n.model"></span>
                        <input type="text" x-model="$store.models.form.model" placeholder="gpt-4o">
                    </label>
                    <label>
                        <span x-text="$store.i18n.temperature"></span>
                        <input type="number" step="0.1" min="0" max="2" x-model="$store.models.form.temperature">
                    </label>
                    <label>
                        <span x-text="$store.i18n.max_output_tokens"></span>
                        <input type="number" min="1" x-model="$store.models.form.max_output_tokens" placeholder="8192">
                    </label>
                </div>
                <p class="model-save-error" x-show="$store.models.saveError" x-text="$store.models.saveError"></p>
                <div class="model-editor-actions">
                    <button @click="$store.models.saveForm()" :disabled="$store.models.saving" x-text="$store.models.saving ? $store.i18n.saving : $store.i18n.save"></button>
                    <button class="outline secondary" @click="$store.models.closeEditor()" x-text="$store.i18n.cancel"></button>
                </div>
            </div>

            <button class="outline" @click="$store.models.newModel()" x-show="!$store.models.editorOpen" x-text="$store.i18n.add_model"></button>
        </div>
    </div>
    <footer class="container-fluid">
        <small>Dev-Assistant-RS — 本地 AI 编程助手</small>
    </footer>
</body>
</html>
