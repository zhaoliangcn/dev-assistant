<!-- 文件浏览器侧栏模板 -->
<div id="file-explorer" class="file-explorer">
  <div class="file-explorer-header">
    <h3>📁 文件浏览器</h3>
    <button class="btn btn-small"
            hx-get="/api/files?path=."
            hx-target="#file-tree"
            hx-trigger="click"
            hx-swap="innerHTML">
      🔄 刷新
    </button>
  </div>
  <div id="file-tree" class="file-tree"
       hx-get="/api/files?path=."
       hx-trigger="load"
       hx-swap="innerHTML">
    <div class="loading">加载中...</div>
  </div>
</div>
