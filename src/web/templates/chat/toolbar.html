<div class="toolbar" x-data="toolbar()">
    <div class="toolbar-actions">
        <button class="outline secondary" @click="clearChat()"
                title="清空对话">
            🗑️ 清空
        </button>
        <button class="outline secondary" @click="toggleSidebar()"
                title="切换侧栏">
            ☰ 侧栏
        </button>
    </div>
    <div class="toolbar-status">
        <span class="status-indicator" :class="connected ? 'online' : 'offline'">
            <span class="status-dot"></span>
            <span x-text="connected ? '已连接' : '未连接'"></span>
        </span>
    </div>
</div>
