<!-- 文件编辑器模板（Phase 2 完善） -->
<div id="file-editor" x-data="fileEditor()" x-show="currentFile !== null" x-cloak>
  <div class="editor-header">
    <span class="editor-title" x-text="currentFile"></span>
    <button class="editor-close" @click="closeEditor()">&times;</button>
  </div>
  <div class="editor-toolbar">
    <button class="btn btn-sm" @click="saveFile()" :disabled="!modified">
      💾 保存
    </button>
    <span class="editor-status" x-text="modified ? '📝 已修改' : '💡 只读'"></span>
  </div>
  <textarea
    class="editor-textarea"
    x-model="content"
    @input="modified = true"
    :disabled="!editable"
    spellcheck="false"
  ></textarea>
</div>
