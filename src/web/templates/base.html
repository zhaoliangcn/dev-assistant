<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dev-Assistant{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- highlight.js 主题样式：由 app.js 按当前主题切换（暗色 github-dark / 亮色 github） -->
    <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
    <header class="container-fluid">
        <nav x-data="{}">
            <ul>
                <li><strong><a href="/" class="contrast">🤖 Dev-Assistant</a></strong></li>
            </ul>
            <ul>
                <li>
                    <span class="status-indicator"
                          :class="$store.connection.connected ? 'online' : 'offline'">
                        <span class="status-dot"></span>
                        <span x-text="$store.connection.connected ? '在线' : '离线'"></span>
                    </span>
                </li>
                <li>
                    <button class="outline secondary" style="width:auto;padding:0.25rem 0.75rem;"
                            @click="$store.theme.toggle()" :title="$store.theme.modeLabel()" aria-label="切换主题">
                        <span x-text="$store.theme.label()"></span>
                    </button>
                </li>
                <li><a href="/" role="button" class="outline secondary">对话</a></li>
            </ul>
        </nav>
    </header>
    <main class="container-fluid">
        {% block content %}{% endblock %}
    </main>
    <footer class="container-fluid">
        <small>Dev-Assistant-RS — 本地 AI 编程助手</small>
    </footer>
</body>
</html>
