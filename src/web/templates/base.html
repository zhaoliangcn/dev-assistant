<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dev-Assistant{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/ext/ws.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
    <header class="container-fluid">
        <nav>
            <ul>
                <li><strong><a href="/" class="contrast">🤖 Dev-Assistant</a></strong></li>
            </ul>
            <ul>
                <li><a href="/" role="button" class="outline secondary">对话</a></li>
            </ul>
        </nav>
    </header>
    <main class="container-fluid">
        {% block content %}{% endblock %}
    </main>
    <footer class="container-fluid">
        <small>Dev-Assistant-RS — 本地 AI 编程助手</small>
    </footer>
</body>
</html>
