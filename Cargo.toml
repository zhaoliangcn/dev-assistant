[package]
name = "dev-assistant-rs"
version = "0.1.0"
edition = "2021"
description = "Rust native AI programming assistant"
license = "MIT"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
async-stream = "0.3"
reqwest = { version = "0.12", features = ["json"] }
reqwest-eventsource = "0.6"
axum = { version = "0.7", optional = true }
tokio-tungstenite = { version = "0.21", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
rustyline = "14.0"
crossterm = "0.27"
globset = "0.4"
walkdir = "2.0"
regex = "1.10"
yaml-rust2 = "0.8"
data-encoding = "2.6"
chrono = { version = "0.4", features = ["serde"] }
lru = "0.12"
hashlink = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
unicode-width = "0.1"
libc = "0.2"
rand = "0.10.2"

[features]
default = []
http-server = ["axum", "tokio-tungstenite"]

[[bin]]
name = "dev-assistant"
path = "src/main.rs"
