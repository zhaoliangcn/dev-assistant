[package]
name = "dev-assistant-rs"
version = "0.1.0"
edition = "2021"
description = "Rust native AI programming assistant"
license = "MIT"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
globset = "0.4"
walkdir = "2.0"
regex = "1.10"
yaml-rust2 = "0.8"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.20"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
unicode-width = "0.1"
libc = "0.2"
rand = "0.10.2"
async-trait = "0.1.89"
shellexpand = "3.0"
dunce = "1.0"
ignore = "0.4"
pulldown-cmark = "0.11"
syntect = { version = "5.1", features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3.10"

[features]
default = []

[[bin]]
name = "dev-assistant"
path = "src/main.rs"
