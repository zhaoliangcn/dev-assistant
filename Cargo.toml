[package]
name = "dev-assistant-rs"
version = "0.1.0"
edition = "2021"
description = "Rust native AI programming assistant"
license = "MIT"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yml = "0.0.12"
clap = { version = "4.0", features = ["derive"] }
globset = "0.4"
walkdir = "2.0"
regex = "1.10"
yaml-rust2 = "0.8"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.20"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
unicode-width = "0.1"
libc = "0.2"
rand = "0.10.2"
async-trait = "0.1.89"
shellexpand = "3.0"
uuid = { version = "1.0", features = ["v4"] }
dunce = "1.0"
ignore = "0.4"
pulldown-cmark = "0.11"
syntect = { version = "5.1", features = ["default-fancy"] }
rustyline = "12.0"
dirs = "5.0"

# Web 界面依赖（Phase 1）
axum = { version = "0.8", features = ["ws", "macros"] }
minijinja = "2.0"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
futures = "0.3"
async-stream = "0.3"

[dev-dependencies]
tempfile = "3.10"

[features]
default = []

[[bin]]
name = "dev-assistant"
path = "src/main.rs"
